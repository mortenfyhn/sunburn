org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# Drop AGP features we don't use so they're skipped during configuration.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false

# Kotlin 2.x uses K2 by default; keep daemon heap modest but sufficient.
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
